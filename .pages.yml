# .pages.yml — generated by scripts/generate-pages-yml.mjs
# Do not hand-edit. Run the script and commit the result.

media:
  input: src/assets/covers
  output: /assets/covers

content:
  # ── Books ──────────────────────────────────────────────────────────────────
  # format: yaml picks up *.yaml files only → every _book.yaml found
  # automatically. New book folder = appears here. No slug list.
  - name: books
    label: Books
    type: collection
    path: src/content
    subfolders: true
    format: yaml
    filename: _book.yaml
    exclude:
      - __built-in__
    view:
      layout: tree
      primary: title
      fields: [title, publisher, price]
      search: [title, publisher]
      node:
        filename: _book.yaml
        hideDirs: others
      default:
        sort: title
        order: asc
    fields:
      - name: title
        type: string
        label: Title
        required: true
      - name: publisher
        type: string
        label: Publisher
        required: true
      - name: publishedDate
        type: date
        label: Published Date
        required: true
      - name: price
        type: string
        label: Price
        required: true
      - name: buyUrl
        type: string
        label: Buy URL
        required: true
      - name: coverImage
        type: image
        label: Cover Image
        required: true

