<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <clipPath id="sphere"><circle cx="64" cy="64" r="52"/></clipPath>
    <radialGradient id="glow" cx="38%" cy="35%" r="62%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sphere base -->
  <circle cx="64" cy="64" r="52" fill="#0a0a0a"/>

  <!-- Quadrant backgrounds + sub-orbs, clipped to sphere -->
  <g clip-path="url(#sphere)">
    <!-- Top-left: Spheres of Power (blue) -->
    <rect x="12" y="12" width="52" height="52" fill="#0D2850"/>
    <!-- Top-right: Spheres of Might (red) -->
    <rect x="64" y="12" width="52" height="52" fill="#3D1200"/>
    <!-- Bottom-left: Spheres of Guile (purple) -->
    <rect x="12" y="64" width="52" height="52" fill="#180B2E"/>
    <!-- Bottom-right: Champions of the Spheres (green) -->
    <rect x="64" y="64" width="52" height="52" fill="#091E0C"/>

    <!-- Power orb -->
    <circle cx="40" cy="40" r="14" fill="#174B93" opacity=".85"/>
    <circle cx="40" cy="40" r="8"  fill="#2E6FD6"/>
    <circle cx="37" cy="37" r="3"  fill="#A0CCFF" opacity=".7"/>
    <!-- Might orb -->
    <circle cx="88" cy="40" r="14" fill="#7A2400" opacity=".85"/>
    <circle cx="88" cy="40" r="8"  fill="#C84A00"/>
    <circle cx="85" cy="37" r="3"  fill="#FFDAC0" opacity=".7"/>
    <!-- Guile orb -->
    <circle cx="40" cy="88" r="14" fill="#2E1260" opacity=".85"/>
    <circle cx="40" cy="88" r="8"  fill="#6B38C0"/>
    <circle cx="37" cy="85" r="3"  fill="#DFC8FF" opacity=".7"/>
    <!-- Champions orb -->
    <circle cx="88" cy="88" r="14" fill="#1A6E22" opacity=".85"/>
    <circle cx="88" cy="88" r="8"  fill="#1E8030"/>
    <circle cx="85" cy="85" r="3"  fill="#90E8A0" opacity=".7"/>

    <!-- Quadrant dividers -->
    <line x1="64" y1="12"  x2="64" y2="116" stroke="#0a0a0a" stroke-width="2.5"/>
    <line x1="12" y1="64"  x2="116" y2="64" stroke="#0a0a0a" stroke-width="2.5"/>
  </g>

  <!-- Sphere border -->
  <circle cx="64" cy="64" r="52" fill="none" stroke="#2a2a2a" stroke-width="2"/>

  <!-- Center binding gem -->
  <circle cx="64" cy="64" r="6"   fill="#1a1a1a"/>
  <circle cx="64" cy="64" r="3"   fill="#e8dfc0"/>
  <circle cx="62" cy="62" r="1.2" fill="#ffffff" opacity=".8"/>

  <!-- Highlight overlay -->
  <circle cx="64" cy="64" r="52" fill="url(#glow)"/>
</svg>
