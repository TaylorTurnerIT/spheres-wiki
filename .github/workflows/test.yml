name: Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Unit tests (Vitest) ─────────────────────────────────────────────────
  unit:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run test -- --reporter=default --reporter=junit --outputFile=test-results/vitest.xml
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-results
          path: test-results/

  # ── Validation scripts ──────────────────────────────────────────────────
  validate:
    name: Content Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run validate

  # ── Lighthouse CI (performance budget) ──────────────────────────────────
  lighthouse:
    name: Lighthouse (Perf Budget)
    runs-on: ubuntu-latest
    needs: [validate]
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Start preview server
        run: |
          bun run preview -- --host 127.0.0.1 > /tmp/spheres-wiki-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4321/spheres-wiki/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/spheres-wiki-preview.log
          exit 1
      - name: View Transition smoke test
        run: bun run test:browser
      - name: Upload View Transition artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: view-transition-report
          path: test-results/view-transition/
          retention-days: 7
      - run: bunx lhci autorun
      - name: Upload Lighthouse report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 7
