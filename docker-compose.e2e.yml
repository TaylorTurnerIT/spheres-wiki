# Fast local iteration: reuse host-built dist/ to avoid rebuilding Astro inside Docker.
#
# Usage:
#   npm run build              # build the static site once on the host
#   docker compose -f docker-compose.e2e.yml up --build --abort-on-container-exit
#
# For CI (self-contained build+test):
#   docker build -f Dockerfile.e2e -t spheres-wiki-e2e .
#   docker run --rm spheres-wiki-e2e

services:
  playwright:
    image: mcr.microsoft.com/playwright:v1.60.0-noble
    working_dir: /app
    command: >
      sh -c "
        npm install --no-save @playwright/test@1.60 serve@14 2>&1 || (echo NPM_FAILED; exit 1) &&
        echo '=== npm install OK ===' &&
        # Dist is mounted ro and built for /spheres-wiki/ base path.
        # Copy to writable tmp, create symlink: /tmp/site/spheres-wiki → /tmp/site
        # Then serve from /tmp/site so both / and /spheres-wiki/ resolve correctly.
        cp -r /app/dist /tmp/site &&
        ln -sfn /tmp/site /tmp/site/spheres-wiki &&
        echo '=== serving ===' &&
        /app/node_modules/.bin/serve /tmp/site -l 4321 &
        sleep 3 &&
        echo '=== running tests ===' &&
        /app/node_modules/.bin/playwright test --reporter=list
      "
    volumes:
      - ./dist:/app/dist:ro
      - ./tests/e2e:/app/tests/e2e:ro
      - ./playwright.config.ts:/app/playwright.config.ts:ro
      - ./package.json:/app/package.json:ro
      - playwright-report:/app/playwright-report
      - test-results:/app/test-results
    environment:
      - CI=true
      - PLAYWRIGHT_DOCKER=true
    ports:
      - "4321:4321"

volumes:
  playwright-report:
  test-results:
