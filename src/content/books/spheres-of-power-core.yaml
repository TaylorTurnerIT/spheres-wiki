title: "Spheres of Power"
publisher: "Drop Dead Studios"
slug: spheres-of-power-core
publishedDate: "2017-01-01"
price: "$19.99"
buyUrl: "https://www.drivethrurpg.com/product/188676"
entries:
  - type: sphere
    id: alteration
    namespace: power
    name: Alteration
    icon: alteration
    description: >
      The Alteration sphere allows a caster to change the shape and physical
      properties of targets. Upon gaining the Alteration sphere, you gain the
      ability to alter small features of willing targets within Close range.

  - type: talent
    id: alter-shape
    sphere: alteration
    namespace: power
    tier: basic
    name: Alter Shape
    description: >
      You may change the general shape of a willing target, granting a +2
      circumstance bonus to one physical ability score of your choice for
      1 minute per caster level.

  - type: talent
    id: elemental-alteration
    sphere: alteration
    namespace: power
    tier: basic
    name: Elemental Alteration
    description: >
      You may imbue a target's natural attacks or unarmed strikes with an
      elemental damage type you choose when you apply this effect. The chosen
      type adds that damage to each hit.

  - type: talent
    id: greater-alteration
    sphere: alteration
    namespace: power
    tier: advanced
    name: Greater Alteration
    description: >
      You may make more dramatic alterations, granting a fly speed of 30 ft
      (average), a swim speed of 30 ft, or a natural armor bonus of +4, in
      addition to your normal alteration effects.

  - type: class
    id: shifter
    namespace: power
    name: Shifter
    description: >
      The Shifter is a spherecaster who specializes in self-transformation.
      They gain the Alteration sphere at 1st level as a bonus sphere and
      treats their caster level as 1 higher for Alteration sphere effects.
